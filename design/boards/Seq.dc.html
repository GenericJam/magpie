<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magpie sequencer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden">
  <div style="position: absolute; left: 28px; right: 28px; top: 8px; height: 44px; display: flex; align-items: center; gap: 8px">
    <a href="Pads.dc.html" style="height: 44px; padding: 0 12px 0 8px; border-radius: 12px; background: #221F2B; color: #F3EFF8; text-decoration: none; display: flex; align-items: center; gap: 4px; font: 600 13px Inter, sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3EFF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Pads</a>
    <div role="tablist" aria-label="Pattern" style="display: grid; grid-template-columns: repeat(4, 44px); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925">
      <sc-for list="{{pats}}" as="p" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{p.sel}}" style="height: 38px; border-radius: 9px; border: none; background: {{p.bg}}; color: {{p.fg}}; font: 700 12px 'JetBrains Mono', monospace">{{p.n}}</button></sc-for>
    </div>
    <span style="height: 44px; padding: 0 10px; border-radius: 12px; background: #1C1925; display: flex; align-items: center; font: 600 12px 'JetBrains Mono', monospace">16 steps</span>
    <span style="height: 44px; padding: 0 10px; border-radius: 12px; background: #1C1925; display: flex; align-items: center; font: 600 12px 'JetBrains Mono', monospace">swing 54%</span>
    <span style="flex: 1"></span>
    <span style="height: 44px; padding: 0 10px; border-radius: 12px; background: #1C1925; display: flex; align-items: center; font: 600 12px 'JetBrains Mono', monospace">96 bpm</span>
    <button type="button" aria-pressed="true" style="height: 44px; padding: 0 10px; border-radius: 12px; border: none; background: #34304A; color: #C6F24E; font: 600 12px 'JetBrains Mono', monospace">Snap 1/16</button>
    <button type="button" aria-label="Stop" style="width: 48px; height: 44px; border-radius: 12px; border: none; background: #C6F24E; display: flex; align-items: center; justify-content: center"><span style="width: 13px; height: 13px; border-radius: 2px; background: #14121A"></span></button>
    <button type="button" aria-label="Record live" style="width: 48px; height: 44px; border-radius: 12px; border: none; background: #221F2B; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 7px; background: #FF9A7A"></span></button>
  </div>

  <div style="position: absolute; left: 28px; top: 60px; width: 788px; height: 318px; display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{lanes}}" as="ln" hint-placeholder-count="6">
      <div style="flex: 1; display: flex; gap: 3px">
        <button type="button" style="width: 92px; flex: none; border-radius: 10px; border: none; background: #1C1925; color: #F3EFF8; display: flex; align-items: center; gap: 8px; padding: 0 10px; font: 700 11px Inter, sans-serif; text-align: left"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{ln.c}}; flex: none"></span>{{ln.name}}</button>
        <sc-for list="{{ln.steps}}" as="s" hint-placeholder-count="16">
          <div style="position: relative; flex: 1; border-radius: 7px; background: {{s.bg}}; box-shadow: inset 0 0 0 {{s.ringW}}px #F3EFF8; overflow: hidden">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{s.h}}%; background: {{s.c}}; opacity: {{s.o}}"></div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: {{head.l}}px; top: 57px; width: {{head.w}}px; height: 4px; border-radius: 2px; background: #F3EFF8"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var pats = ['A1', 'A2', 'A3', '+'].map(function (n, i) { return { n: n, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? '#34304A' : 'transparent', fg: i === 0 ? '#F3EFF8' : '#A9A3B8' }; });
    var lanesDef = [
      ['KICK', '#FF9A7A', { 0: 100, 4: 100, 8: 100, 10: 45, 12: 100 }],
      ['SNARE', '#FF9A7A', { 4: 95, 12: 95, 15: 35 }],
      ['HAT', '#FFB547', { 0: 70, 2: 45, 4: 70, 6: 45, 8: 70, 10: 45, 12: 70 }],
      ['OPEN HAT', '#FFB547', { 14: 80 }],
      ['CLAP', '#FF8FC7', { 12: 75 }],
      ['CHOP 2', '#B9A2FF', { 3: 60, 7: 85, 11: 60 }]
    ];
    var play = 5;
    var lanes = lanesDef.map(function (l) {
      var steps = [];
      for (var i = 0; i < 16; i++) {
        var v = l[2][i], beat = Math.floor(i / 4) % 2 === 0;
        steps.push({ bg: beat ? '#221F2B' : '#1C1925', c: l[1], h: v ? Math.max(25, v) : 0, o: v ? (i === play ? 1 : 0.85) : 0, ringW: i === play ? 1 : 0 });
      }
      return { name: l[0], c: l[1], steps: steps };
    });
    var x0 = 28 + 92 + 3, sw = (788 - 92 - 3 - 15 * 3) / 16;
    var head = { l: Math.round(x0 + play * (sw + 3)), w: Math.round(sw) };
    return { pats: pats, lanes: lanes, head: head };
  }
}
</script>
</body>
</html>
