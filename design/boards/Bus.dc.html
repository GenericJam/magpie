<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bus mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Menu" style="width: 44px; height: 44px; border-radius: 22px; border: none; padding: 0; background: #221F2B; display: flex; align-items: center; justify-content: center; flex: none"><dc-import mood="play" size="0.5" hint-size="32px,28px" name="Bird"></dc-import></button>
    <div role="tablist" aria-label="Bank" style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925">
      <sc-for list="{{banks}}" as="b" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{b.sel}}" style="height: 38px; border-radius: 9px; border: none; background: {{b.bg}}; color: {{b.fg}}; font: 700 13px 'JetBrains Mono', monospace">{{b.n}}</button></sc-for>
    </div>
    <button type="button" aria-label="Play" style="width: 48px; height: 44px; border-radius: 12px; border: none; background: #C6F24E; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#14121A" aria-hidden="true"><path d="M7 4l12 8-12 8z"></path></svg></button>
  </div>

  <div style="height: 470px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{pads}}" as="p" hint-placeholder-count="16">
      <div style="position: relative; border-radius: 14px; overflow: hidden; background: #221F2B; box-shadow: inset 0 0 0 1px #2E2A3B; margin-top: {{p.dy}}px">
        <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{p.c}}; opacity: {{p.tint}}"></div>
        <span style="position: absolute; left: 8px; top: 8px; font: 700 11px/1.1 Inter, sans-serif; color: {{p.fg}}">{{p.name}}</span>
        <sc-if value="{{p.hit}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; right: 0; top: 30px; height: 2px; background: #14121A; opacity: 0.6"></div><span style="position: absolute; right: 6px; top: 8px; padding: 2px 4px; border-radius: 5px; background: #14121A; font: 700 9px/1 'JetBrains Mono', monospace">v112</span></sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: #A9A3B8">STEPS ·</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FF9A7A"></span>KICK</span>
      <span style="font-size: 12px; color: #A9A3B8">tap a pad to switch lane</span>
      <span style="flex: 1"></span>
      <span style="font: 600 11px 'JetBrains Mono', monospace; color: #C6F24E">snap 1/16</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="16"><div style="height: 40px; border-radius: 8px; background: {{s.bg}}; box-shadow: inset 0 0 0 {{s.ringW}}px #F3EFF8"></div></sc-for>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; gap: 8px">
    <a href="Record.dc.html" style="flex: 1; height: 52px; border-radius: 14px; background: #2A2636; color: #F3EFF8; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 14px Inter, sans-serif"><span style="width: 12px; height: 12px; border-radius: 6px; background: #FF9A7A"></span>Sample</a>
    <button type="button" style="flex: 1; height: 52px; border-radius: 14px; border: none; background: #2A2636; color: #F3EFF8; font: 600 14px Inter, sans-serif">Rec pattern</button>
    <span style="height: 52px; padding: 0 12px; border-radius: 14px; background: #1C1925; display: flex; align-items: center; font: 600 12px 'JetBrains Mono', monospace">96</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var banks = ['A', 'B', 'C', 'D'].map(function (n, i) { return { n: n, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? '#34304A' : 'transparent', fg: i === 0 ? '#F3EFF8' : '#A9A3B8' }; });
    var defs = [['KICK', '#FF9A7A'], ['SNARE', '#FF9A7A'], ['HAT', '#FFB547'], ['OPEN HAT', '#FFB547'], ['CLAP', '#FF8FC7'], ['RIM', '#FF8FC7'], ['“HEY!”', '#5ED6C0'], ['FM STAB', '#8FD8FF'], ['CHOP 1', '#B9A2FF'], ['CHOP 2', '#B9A2FF'], ['CHOP 3', '#B9A2FF'], ['CHOP 4', '#B9A2FF'], ['LOOP', '#C6F24E'], ['PAD', '#F3EBD6'], ['', '#221F2B'], ['', '#221F2B']];
    var pads = defs.map(function (d, i) { var hit = i === 0; return { name: d[0], c: d[1], tint: hit ? 1 : (d[0] ? 0.26 : 0), fg: hit ? '#14121A' : '#F3EFF8', hit: hit, dy: hit ? 2 : 0 }; });
    var on = { 0: 1, 4: 1, 8: 1, 10: 1, 12: 1 };
    var steps = []; for (var i = 0; i < 16; i++) steps.push({ bg: on[i] ? '#FF9A7A' : (Math.floor(i / 4) % 2 ? '#1C1925' : '#221F2B'), ringW: i === 5 ? 2 : 0 });
    return { banks: banks, pads: pads, steps: steps };
  }
}
</script>
</body>
</html>
