<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The magpie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: {{W}}px; height: {{H}}px; font-family: Inter, sans-serif; color: #F3EFF8" aria-hidden="true">
  <svg style="position: absolute; left: 0; top: 0; overflow: visible" width="{{W}}" height="{{H}}" viewBox="0 0 64 56">
    <sc-for list="{{pile}}" as="p" hint-placeholder-count="0"><rect x="{{p.x}}" y="{{p.y}}" width="8" height="8" rx="2" fill="{{p.c}}"></rect></sc-for>
    <path d="M17 {{tailY}} L1 53 L5 56 L22 {{tailY2}} Z" fill="{{wingC}}"></path>
    <rect x="27" y="43" width="2" height="8" rx="1" fill="#6B6580"></rect>
    <rect x="34" y="43" width="2" height="8" rx="1" fill="#6B6580"></rect>
    <ellipse cx="30" cy="{{bodyY}}" rx="17" ry="14.5" fill="{{bodyC}}" stroke="#4A4560" stroke-width="1.2"></ellipse>
    <ellipse cx="33" cy="{{bellyY}}" rx="11" ry="8.5" fill="{{bellyC}}"></ellipse>
    <ellipse cx="22" cy="{{wingY}}" rx="10" ry="{{wingRy}}" fill="{{wingC}}"></ellipse>
    <ellipse cx="24" cy="{{patchY}}" rx="5.5" ry="2.4" fill="{{bellyC}}"></ellipse>
    <circle cx="41" cy="{{headY}}" r="10" fill="{{bodyC}}" stroke="#4A4560" stroke-width="1.2"></circle>
    <path d="{{beak}}" fill="#8F89A3"></path>
    <sc-if value="{{trinket.on}}" hint-placeholder-val="{{false}}"><rect x="56" y="{{trinket.y}}" width="8" height="8" rx="2" fill="{{trinket.c}}"></rect><rect x="58" y="{{trinket.y2}}" width="2.5" height="2" rx="1" fill="#FFFFFF" opacity="0.7"></rect></sc-if>
    <sc-for list="{{eyes}}" as="e" hint-placeholder-count="2">
      <sc-if value="{{e.open}}" hint-placeholder-val="{{true}}"><circle cx="{{e.cx}}" cy="{{e.cy}}" r="{{e.r}}" fill="#FFFFFF"></circle><circle cx="{{e.px}}" cy="{{e.py}}" r="2.2" fill="#17141F"></circle></sc-if>
      <sc-if value="{{e.closed}}" hint-placeholder-val="{{false}}"><path d="{{e.line}}" fill="none" stroke="#F3EFF8" stroke-width="1.6" stroke-linecap="round"></path></sc-if>
    </sc-for>
    <sc-for list="{{marks}}" as="m" hint-placeholder-count="0"><path d="{{m.d}}" fill="none" stroke="{{m.c}}" stroke-width="1.6" stroke-linecap="round"></path></sc-for>
  </svg>
  <sc-if value="{{zz.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: {{zz.l}}px; top: 0; font-size: {{zz.fs}}px; line-height: 1; font-weight: 700; color: #A9A3B8">z<span style="font-size: {{zz.fs2}}px">Z</span></span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["idle","listen","grab","play","proud","sleep","nomic"],"default":"idle"},"size":{"editor":"float","min":0.3,"max":8,"step":0.1,"default":3.5},"trinket":{"editor":"enum","options":["lime","coral","amber","sky","violet","pink","teal"],"default":"lime"},"look":{"editor":"enum","options":["center","left","right","up","down"],"default":"center"},"$preview":{"width":224,"height":196}}'>
class Component extends DCLogic {
  renderVals() {
    var P = this.props;
    var s = parseFloat(P.size == null ? 3.5 : P.size); if (!(s > 0)) s = 3.5;
    var mood = P.mood || 'idle';
    var PADS = { lime: '#C6F24E', coral: '#FF9A7A', amber: '#FFB547', sky: '#8FD8FF', violet: '#B9A2FF', pink: '#FF8FC7', teal: '#5ED6C0' };
    var grey = mood === 'sleep' || mood === 'nomic';
    var bodyC = grey ? '#4A4560' : '#2E2A3B';
    var bellyC = grey ? '#8F89A3' : '#F3EFF8';
    var wingC = grey ? '#5A5470' : '#3FA7C9';
    var bob = mood === 'play' ? -2 : 0;
    var proud = mood === 'proud';
    var lift = proud ? -2 : 0;
    var bodyY = 30 + bob + lift, headY = 18 + bob + lift * 1.5;
    var LOOK = { center: [0, 0], left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
    var lk = LOOK[P.look] || LOOK.center;
    if (mood === 'listen') lk = [0.6, -1];
    if (mood === 'grab') lk = [1, 0.2];
    if (proud) lk = [0, 1];
    var closed = grey;
    var eye = function (cx, big) {
      var cy = headY - 2, r = mood === 'listen' ? 5.2 : 4.5;
      return { open: !closed, closed: closed, cx: cx, cy: cy, r: r, px: (cx + lk[0] * 2).toFixed(1), py: (cy + lk[1] * 2).toFixed(1), line: 'M' + (cx - 3.5) + ' ' + cy + ' L' + (cx + 3.5) + ' ' + cy };
    };
    var eyes = [eye(37), eye(45.5)];
    var by = headY + 2;
    var beak = mood === 'grab' ? ('M49 ' + (by - 1.5) + ' L57 ' + (by - 1) + ' L49 ' + (by + 0.5) + ' Z M49 ' + (by + 1.5) + ' L56 ' + (by + 4) + ' L49 ' + (by + 3) + ' Z') : ('M49 ' + (by - 1.5) + ' L60 ' + by + ' L49 ' + (by + 2) + ' Z');
    var tc = PADS[P.trinket] || PADS.lime;
    var trinket = { on: mood === 'grab', y: by - 3, y2: by - 1.5, c: tc };
    var pile = proud ? [{ x: 8, y: 46, c: PADS.coral }, { x: 40, y: 46, c: PADS.lime }, { x: 48, y: 46, c: PADS.sky }, { x: 44, y: 38, c: PADS.amber }, { x: 14, y: 40, c: PADS.violet }] : [];
    var marks = [];
    if (mood === 'play') marks = [{ d: 'M8 14 v6 M12 12 v8', c: '#A9A3B8' }, { d: 'M54 34 v6 M58 32 v8', c: '#A9A3B8' }];
    if (mood === 'listen') marks = [{ d: 'M56 6 q3 4 0 8 M60 3 q5 7 0 14', c: '#A9A3B8' }];
    var W = Math.round(64 * s), H = Math.round(56 * s);
    return {
      W: W, H: H, bodyY: bodyY, bellyY: bodyY + 7, wingY: bodyY + 1, wingRy: mood === 'play' ? 7.5 : 6, patchY: bodyY - 3, headY: headY,
      tailY: bodyY + 4, tailY2: bodyY + 10, beak: beak, trinket: trinket, eyes: eyes, marks: marks, pile: pile,
      bodyC: bodyC, bellyC: bellyC, wingC: wingC, zz: { on: mood === 'sleep', l: Math.round(50 * s), fs: Math.round(7 * s), fs2: Math.round(10 * s) }
    };
  }
}
</script>
</body>
</html>
