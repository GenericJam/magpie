<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record a sample</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden">
  <div style="position: absolute; left: 28px; top: 8px; width: 260px; height: 370px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px">
      <a href="Pads.dc.html" aria-label="Back to pads" style="width: 44px; height: 44px; border-radius: 22px; background: #221F2B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3EFF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-size: 16px; font-weight: 700">Record into pad A15</span>
    </div>
    <span style="font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: #A9A3B8; margin-top: 4px">SOURCE</span>
    <sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
      <button type="button" aria-pressed="{{s.sel}}" style="min-height: 48px; border-radius: 12px; border: none; background: {{s.bg}}; box-shadow: inset 0 0 0 {{s.ringW}}px #C6F24E; color: #F3EFF8; display: flex; align-items: center; gap: 10px; padding: 6px 12px; text-align: left">
        <span style="width: 34px; height: 24px; border-radius: 6px; background: #2E2A3B; display: flex; align-items: center; justify-content: center; font: 700 9px/1 'JetBrains Mono', monospace; color: {{s.ic}}; flex: none">{{s.icon}}</span>
        <span style="line-height: 1.25"><span style="display: block; font: 600 13px Inter, sans-serif">{{s.name}}</span><span style="display: block; font: 500 10px 'JetBrains Mono', monospace; color: #A9A3B8">{{s.sub}}</span></span>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 304px; top: 8px; width: 512px; height: 370px; display: flex; flex-direction: column; gap: 10px">
    <div style="position: relative; flex: 1; border-radius: 16px; background: #1C1925; overflow: hidden">
      <div style="position: absolute; left: 14px; right: 14px; top: 50%; height: 1px; background: #34304A"></div>
      <div style="position: absolute; left: 14px; top: 20px; bottom: 20px; right: 14px; display: flex; align-items: center; gap: 2px">
        <sc-for list="{{wave}}" as="w" hint-placeholder-count="120"><span style="flex: 1; height: {{w.h}}%; border-radius: 1px; background: {{w.c}}"></span></sc-for>
      </div>
      <div style="position: absolute; left: {{headX}}px; top: 12px; bottom: 12px; width: 2px; background: #FF9A7A"></div>
      <span style="position: absolute; left: 14px; top: 12px; padding: 4px 8px; border-radius: 8px; background: #14121A; font: 700 12px 'JetBrains Mono', monospace; color: #FF9A7A">● REC 0:03.2</span>
      <div style="position: absolute; right: 12px; top: 8px"><dc-import mood="listen" size="0.75" hint-size="48px,42px" name="Bird"></dc-import></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font: 600 11px 'JetBrains Mono', monospace; color: #A9A3B8">IN</span>
      <div style="flex: 1; display: flex; gap: 2px; height: 10px"><sc-for list="{{meter}}" as="m" hint-placeholder-count="30"><span style="flex: 1; border-radius: 2px; background: {{m}}"></span></sc-for></div>
      <span style="font: 600 11px 'JetBrains Mono', monospace; color: #C9C3D6">−6 dB</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925; width: 330px">
        <span style="height: 40px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #A9A3B8">Now</span>
        <span style="height: 40px; border-radius: 9px; background: #34304A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">When sound starts</span>
        <span style="height: 40px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #A9A3B8">Count in 1 bar</span>
      </div>
      <span style="flex: 1"></span>
      <button type="button" style="height: 52px; padding: 0 22px; border-radius: 16px; border: none; background: #FF9A7A; color: #14121A; font: 700 15px Inter, sans-serif; display: flex; align-items: center; gap: 10px"><span style="width: 14px; height: 14px; border-radius: 3px; background: #14121A"></span>Stop</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var s = function (icon, ic, name, sub, sel) { return { icon: icon, ic: ic, name: name, sub: sub, sel: sel ? 'true' : 'false', bg: sel ? '#2A2636' : '#1C1925', ringW: sel ? 2 : 0 }; };
    var sources = [
      s('MIC', '#FF9A7A', 'Microphone', 'phone mic or headset', true),
      s('FM', '#C6F24E', 'FMutate A', 'paired · records its output', false),
      s('APPS', '#8FD8FF', 'Other apps', 'what this phone is playing', false),
      s('FILE', '#E4DFEE', 'Import a file', 'wav, aiff, mp3, flac', false)
    ];
    var wave = [], seed = 11, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (var i = 0; i < 120; i++) {
      var t = i / 120, env = i > 86 ? 0 : (i % 22 < 3 ? 0.95 : 0.25 + 0.5 * Math.exp(-(i % 22) / 6));
      wave.push({ h: i > 86 ? 2 : Math.max(3, Math.round(env * 100 * (0.6 + 0.4 * rnd()))), c: i > 86 ? '#34304A' : '#FF9A7A' });
    }
    var meter = []; for (var m = 0; m < 30; m++) meter.push(m < 22 ? '#C6F24E' : (m < 25 ? '#FFB547' : '#2E2A3B'));
    return { sources: sources, wave: wave, meter: meter, headX: Math.round(14 + (484 * 87 / 120)) };
  }
}
</script>
</body>
</html>
