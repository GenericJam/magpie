<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sample editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden">
  <div style="position: absolute; left: 28px; right: 28px; top: 8px; height: 44px; display: flex; align-items: center; gap: 8px">
    <a href="Pads.dc.html" aria-label="Back to pads" style="width: 44px; height: 44px; border-radius: 22px; background: #221F2B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3EFF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 16px; font-weight: 700">Break 96</span>
    <span style="font: 500 11px 'JetBrains Mono', monospace; color: #A9A3B8">4.00 s · 2 bars · 48 kHz</span>
    <span style="flex: 1"></span>
    <button type="button" aria-label="Play selection" style="width: 48px; height: 44px; border-radius: 12px; border: none; background: #221F2B; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#C6F24E" aria-hidden="true"><path d="M7 4l12 8-12 8z"></path></svg></button>
    <button type="button" style="height: 44px; padding: 0 12px; border-radius: 12px; border: none; background: #221F2B; color: #F3EFF8; font: 600 13px Inter, sans-serif">Undo</button>
  </div>

  <div style="position: absolute; left: 28px; top: 60px; width: 788px; height: 180px; border-radius: 16px; background: #1C1925; overflow: hidden">
    <div style="position: absolute; left: 12px; right: 12px; top: 26px; bottom: 14px; display: flex; align-items: center; gap: 1px">
      <sc-for list="{{wave}}" as="w" hint-placeholder-count="160"><span style="flex: 1; height: {{w.h}}%; background: {{w.c}}"></span></sc-for>
    </div>
    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 46px; background: #14121A; opacity: 0.7"></div>
    <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 30px; background: #14121A; opacity: 0.7"></div>
    <div style="position: absolute; left: 44px; top: 0; bottom: 0; width: 4px; background: #F3EFF8"></div>
    <div style="position: absolute; left: 34px; top: 66px; width: 24px; height: 48px; border-radius: 8px; background: #F3EFF8"></div>
    <div style="position: absolute; right: 28px; top: 0; bottom: 0; width: 4px; background: #F3EFF8"></div>
    <div style="position: absolute; right: 18px; top: 66px; width: 24px; height: 48px; border-radius: 8px; background: #F3EFF8"></div>
    <sc-for list="{{slices}}" as="s" hint-placeholder-count="8">
      <div style="position: absolute; left: {{s.x}}px; top: 0; bottom: 0; width: 2px; background: #B9A2FF"></div>
      <span style="position: absolute; left: {{s.x}}px; top: 4px; width: 20px; height: 18px; border-radius: 0 5px 5px 0; background: #B9A2FF; color: #14121A; display: flex; align-items: center; justify-content: center; font: 700 10px 'JetBrains Mono', monospace">{{s.n}}</span>
    </sc-for>
  </div>
  <p style="position: absolute; left: 28px; top: 243px; margin: 0; font-size: 11px; color: #A9A3B8">Drag the white handles to trim · drag a violet marker to move a slice, tap the wave to add one · pinch to zoom</p>

  <div style="position: absolute; left: 28px; right: 28px; top: 262px; display: flex; gap: 8px; align-items: stretch">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font: 600 10px 'JetBrains Mono', monospace; color: #A9A3B8">CHOP</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925; width: 240px">
        <span style="height: 38px; border-radius: 9px; background: #34304A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">By hits · 8</span>
        <span style="height: 38px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #A9A3B8">Even</span>
        <span style="height: 38px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #A9A3B8">Off</span>
      </div>
    </div>
    <sc-for list="{{knobs}}" as="k" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font: 600 10px 'JetBrains Mono', monospace; color: #A9A3B8">{{k.label}}</span>
        <div style="height: 44px; width: 92px; border-radius: 12px; background: #1C1925; display: flex; align-items: center; justify-content: center; font: 600 12px 'JetBrains Mono', monospace; color: {{k.c}}">{{k.v}}</div>
      </div>
    </sc-for>
    <span style="flex: 1"></span>
  </div>
  <div style="position: absolute; left: 28px; right: 28px; bottom: 8px; display: flex; gap: 8px; justify-content: flex-end">
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 14px; border: none; background: #2A2636; color: #F3EFF8; font: 600 14px Inter, sans-serif">Save to pad A13</button>
    <button type="button" style="height: 48px; padding: 0 18px; border-radius: 14px; border: none; background: #C6F24E; color: #14121A; font: 700 14px Inter, sans-serif">Send 8 slices to pads B1–B8</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var N = 160, wave = [], seed = 5, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    var hits = [6, 24, 40, 58, 76, 96, 112, 132];
    for (var i = 0; i < N; i++) {
      var d = 99; hits.forEach(function (h) { if (i >= h && i - h < d) d = i - h; });
      var env = d === 99 ? 0.08 : Math.exp(-d / 5);
      var out = i < 6 || i > 150;
      wave.push({ h: Math.max(2, Math.round(100 * env * (0.65 + 0.35 * rnd()))), c: out ? '#4A4560' : '#C6F24E' });
    }
    var x = function (i) { return Math.round(12 + i * (764 / N)); };
    var slices = hits.map(function (h, i) { return { x: x(h), n: i + 1 }; });
    var knobs = [['PITCH', '+0 st', '#F3EFF8'], ['GAIN', '+2.0 dB', '#F3EFF8'], ['FADE', '5 / 40 ms', '#F3EFF8'], ['REVERSE', 'off', '#A9A3B8']].map(function (k) { return { label: k[0], v: k[1], c: k[2] }; });
    return { wave: wave, slices: slices, knobs: knobs };
  }
}
</script>
</body>
</html>
