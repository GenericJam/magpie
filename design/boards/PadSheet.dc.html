<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pad settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; background: #0E0D12; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden">
  <div style="position: absolute; left: 28px; top: 60px; width: 380px; height: 318px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; opacity: 0.4">
    <sc-for list="{{dim}}" as="d" hint-placeholder-count="8"><div style="border-radius: 14px; background: {{d.c}}; box-shadow: inset 0 0 0 {{d.ringW}}px #F3EFF8"></div></sc-for>
  </div>
  <span style="position: absolute; left: 28px; top: 22px; font-size: 12px; color: #A9A3B8">Long-press a pad for its settings</span>

  <div style="position: absolute; left: 432px; top: 0; right: 0; bottom: 0; background: #1C1925; border-radius: 24px 0 0 24px; padding: 14px 28px 14px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 22px; height: 22px; border-radius: 6px; background: #B9A2FF"></span>
      <span style="flex: 1; font-size: 16px; font-weight: 700">CHOP 2 <span style="font: 500 11px 'JetBrains Mono', monospace; color: #A9A3B8">· pad B2</span></span>
      <a href="Pads.dc.html" style="height: 36px; padding: 0 14px; border-radius: 18px; background: #C6F24E; color: #14121A; text-decoration: none; display: flex; align-items: center; font: 700 13px Inter, sans-serif">Done</a>
    </div>
    <div style="display: flex; gap: 6px">
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="8"><button type="button" aria-label="{{s.n}}" style="width: 36px; height: 30px; border-radius: 8px; border: none; background: {{s.c}}; box-shadow: 0 0 0 {{s.ringW}}px #F3EFF8"></button></sc-for>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 70px; font-size: 13px; font-weight: 600">{{r.label}}</span>
        <div style="flex: 1; display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: #14121A">
          <sc-for list="{{r.opts}}" as="o" hint-placeholder-count="4"><span style="flex: 1; height: 34px; border-radius: 9px; background: {{o.bg}}; color: {{o.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{o.t}}</span></sc-for>
        </div>
      </div>
    </sc-for>
    <div style="display: flex; gap: 8px">
      <div style="flex: 1; height: 40px; border-radius: 12px; background: #14121A; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px"><span style="color: #A9A3B8">Pitch</span><span style="font-family: 'JetBrains Mono', monospace">+0 st</span></div>
      <div style="flex: 1; height: 40px; border-radius: 12px; background: #14121A; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px"><span style="color: #A9A3B8">MIDI note</span><span style="font-family: 'JetBrains Mono', monospace">D2 · 38</span></div>
    </div>
    <div style="margin-top: auto; display: flex; gap: 8px">
      <a href="Editor.dc.html" style="flex: 1; height: 44px; border-radius: 12px; background: #2A2636; color: #F3EFF8; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif">Edit sample</a>
      <a href="Record.dc.html" style="flex: 1; height: 44px; border-radius: 12px; background: #2A2636; color: #F3EFF8; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif">Replace</a>
      <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: none; background: transparent; box-shadow: inset 0 0 0 1px #4A4560; color: #FFB4A3; font: 600 13px Inter, sans-serif">Clear</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var dim = ['#B9A2FF', '#B9A2FF', '#B9A2FF', '#B9A2FF', '#C6F24E', '#F3EBD6', '#221F2B', '#221F2B'].map(function (c, i) { return { c: c, ringW: i === 1 ? 3 : 0 }; });
    var swatches = [['coral', '#FF9A7A'], ['amber', '#FFB547'], ['lime', '#C6F24E'], ['teal', '#5ED6C0'], ['sky', '#8FD8FF'], ['violet', '#B9A2FF'], ['pink', '#FF8FC7'], ['cream', '#F3EBD6']].map(function (s) { return { n: s[0], c: s[1], ringW: s[0] === 'violet' ? 2 : 0 }; });
    var seg = function (label, opts, sel) { return { label: label, opts: opts.map(function (t) { var on = t === sel; return { t: t, bg: on ? '#34304A' : 'transparent', fg: on ? '#F3EFF8' : '#A9A3B8' }; }) }; };
    var rows = [
      seg('Play', ['One-shot', 'Gate', 'Loop', 'Toggle', 'Keys'], 'One-shot'),
      seg('Cuts off', ['None', 'Grp 1', 'Grp 2', 'Grp 3'], 'Grp 2'),
      seg('Velocity', ['Where you hit', 'Fixed 100'], 'Where you hit')
    ];
    return { dim: dim, swatches: swatches, rows: rows };
  }
}
</script>
</body>
</html>
