<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magpie pads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden">
  <div style="position: absolute; left: 28px; right: 28px; top: 8px; height: 44px; display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Menu" style="width: 44px; height: 44px; border-radius: 22px; border: none; padding: 0; background: #221F2B; display: flex; align-items: center; justify-content: center; flex: none"><dc-import mood="play" size="0.5" hint-size="32px,28px" name="Bird"></dc-import></button>
    <div role="tablist" aria-label="Bank" style="display: grid; grid-template-columns: repeat(4, 40px); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925">
      <sc-for list="{{banks}}" as="b" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{b.sel}}" style="height: 38px; border-radius: 9px; border: none; background: {{b.bg}}; color: {{b.fg}}; font: 700 13px 'JetBrains Mono', monospace">{{b.n}}</button></sc-for>
    </div>
    <a href="Library.dc.html" style="height: 44px; padding: 0 12px; border-radius: 12px; background: #1C1925; color: #F3EFF8; text-decoration: none; display: flex; align-items: center; gap: 6px; font: 600 13px Inter, sans-serif">Dusty Breaks<span style="color: #A9A3B8">▾</span></a>
    <span style="flex: 1"></span>
    <span style="height: 44px; padding: 0 10px; border-radius: 12px; background: #1C1925; display: flex; align-items: center; font: 600 12px 'JetBrains Mono', monospace">96 bpm</span>
    <button type="button" aria-pressed="true" style="height: 44px; padding: 0 10px; border-radius: 12px; border: none; background: #34304A; color: #C6F24E; font: 600 12px 'JetBrains Mono', monospace">Snap 1/16</button>
    <button type="button" aria-label="Play" style="width: 48px; height: 44px; border-radius: 12px; border: none; background: #C6F24E; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#14121A" aria-hidden="true"><path d="M7 4l12 8-12 8z"></path></svg></button>
    <button type="button" aria-label="Record pattern" style="width: 48px; height: 44px; border-radius: 12px; border: none; background: #221F2B; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 7px; background: #FF9A7A"></span></button>
    <a href="Seq.dc.html" style="height: 44px; padding: 0 12px; border-radius: 12px; background: #221F2B; color: #F3EFF8; text-decoration: none; display: flex; align-items: center; font: 600 13px Inter, sans-serif">Seq</a>
  </div>

  <div style="position: absolute; left: 28px; top: 60px; width: 788px; height: 318px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{pads}}" as="p" hint-placeholder-count="16">
      <div style="position: relative; border-radius: 14px; overflow: hidden; background: {{p.base}}; box-shadow: inset 0 0 0 {{p.ringW}}px {{p.ring}}; margin-top: {{p.dy}}px">
        <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{p.c}}; opacity: {{p.tint}}"></div>
        <sc-if value="{{p.hasWave}}" hint-placeholder-val="{{true}}">
          <div style="position: absolute; left: 8px; right: 8px; bottom: 30px; height: 26px; display: flex; align-items: center; gap: 2px"><sc-for list="{{p.wave}}" as="w" hint-placeholder-count="12"><span style="flex: 1; height: {{w}}px; border-radius: 1px; background: {{p.waveC}}"></span></sc-for></div>
        </sc-if>
        <span style="position: absolute; left: 9px; top: 9px; font: 700 12px/1.1 Inter, sans-serif; color: {{p.fg}}">{{p.name}}</span>
        <span style="position: absolute; left: 9px; bottom: 9px; font: 600 10px/1 'JetBrains Mono', monospace; color: {{p.sub}}">{{p.mode}}</span>
        <sc-if value="{{p.hit}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: 0; right: 0; top: {{p.hitY}}px; height: 2px; background: #14121A; opacity: 0.6"></div>
          <div style="position: absolute; left: 30px; top: {{p.ringY}}px; width: 32px; height: 32px; border-radius: 16px; box-sizing: border-box; border: 2px solid #14121A; opacity: 0.45"></div>
          <span style="position: absolute; right: 7px; top: {{p.velY}}px; padding: 2px 5px; border-radius: 5px; background: #14121A; color: #F3EFF8; font: 700 10px/1 'JetBrains Mono', monospace">v{{p.vel}}</span>
        </sc-if>
        <sc-if value="{{p.loop}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; bottom: 0; height: 4px; width: 62%; background: #14121A; opacity: 0.55"></div></sc-if>
        <sc-if value="{{p.empty}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9A3B8; font: 600 12px Inter, sans-serif"><span style="font: 400 26px/1 Inter, sans-serif">+</span>record<br>or load</div></sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var banks = ['A', 'B', 'C', 'D'].map(function (n, i) { return { n: n, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? '#34304A' : 'transparent', fg: i === 0 ? '#F3EFF8' : '#A9A3B8' }; });
    var C = { coral: '#FF9A7A', amber: '#FFB547', lime: '#C6F24E', teal: '#5ED6C0', sky: '#8FD8FF', violet: '#B9A2FF', pink: '#FF8FC7', cream: '#F3EBD6' };
    var seed = 3, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    var wave = function (shape) { var a = []; for (var i = 0; i < 12; i++) { var e = shape === 'hit' ? Math.max(0.12, 1 - i / 7) : shape === 'loop' ? 0.4 + 0.5 * rnd() : 0.25 + 0.6 * rnd(); a.push(Math.round(4 + 22 * e)); } return a; };
    var H = (318 - 8) / 2;
    var mk = function (name, col, mode, shape, o) {
      return Object.assign({ name: name, c: C[col] || '#221F2B', mode: mode, wave: wave(shape), hasWave: true, base: '#221F2B', tint: 0.26, fg: '#F3EFF8', sub: '#C9C3D6', waveC: C[col] || '#4A4560', ring: '#2E2A3B', ringW: 1, dy: 0, hit: false, loop: false, empty: false, hitY: 0, ringY: 0, velY: 0, vel: 0 }, o || {});
    };
    var hit = function (p, frac) {
      var y = Math.round(H * frac);
      p.hit = true; p.tint = 1; p.fg = '#14121A'; p.sub = '#14121A'; p.waveC = '#14121A'; p.ring = p.c; p.dy = 2;
      p.hitY = y; p.ringY = y - 16; p.velY = Math.max(6, y - 22); p.vel = Math.round(127 * (1 - frac * 0.85)); return p;
    };
    var pads = [
      hit(mk('KICK', 'coral', 'one-shot', 'hit'), 0.22),
      mk('SNARE', 'coral', 'one-shot', 'hit'),
      mk('HAT', 'amber', 'choke 1', 'hit'),
      mk('OPEN HAT', 'amber', 'choke 1', 'hit'),
      mk('CLAP', 'pink', 'one-shot', 'hit'),
      mk('RIM', 'pink', 'one-shot', 'hit'),
      mk('“HEY!”', 'teal', 'gate', 'vox'),
      mk('FM STAB', 'sky', 'from FMutate', 'vox'),
      mk('CHOP 1', 'violet', 'one-shot', 'vox'),
      hit(mk('CHOP 2', 'violet', 'one-shot', 'vox'), 0.7),
      mk('CHOP 3', 'violet', 'one-shot', 'vox'),
      mk('CHOP 4', 'violet', 'one-shot', 'vox'),
      Object.assign(mk('BREAK LOOP', 'lime', 'loop · playing', 'loop'), { loop: true, tint: 0.55 }),
      mk('PAD', 'cream', 'keys', 'vox'),
      Object.assign(mk('', null, '', 'hit'), { empty: true, hasWave: false, tint: 0, base: 'transparent', ring: '#34304A', ringW: 2 }),
      Object.assign(mk('', null, '', 'hit'), { empty: true, hasWave: false, tint: 0, base: 'transparent', ring: '#34304A', ringW: 2 })
    ];
    return { banks: banks, pads: pads };
  }
}
</script>
</body>
</html>
