<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magpie connections</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden">
  <div style="position: absolute; left: 28px; top: 8px; width: 300px; height: 374px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px">
      <a href="Pads.dc.html" aria-label="Back to pads" style="width: 44px; height: 44px; border-radius: 22px; background: #221F2B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3EFF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="flex: 1; font-size: 16px; font-weight: 700">Pair an app</span>
      <div role="tablist" aria-label="Pairing" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925; width: 150px">
        <span role="tab" aria-selected="true" style="height: 36px; border-radius: 9px; background: #34304A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">Scan</span>
        <span role="tab" aria-selected="false" style="height: 36px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #A9A3B8">My code</span>
      </div>
    </div>
    <div style="position: relative; flex: 1; border-radius: 16px; background: #241F2A; overflow: hidden">
      <div style="position: absolute; left: 82px; top: 52px; width: 136px; height: 136px; background: #E9E4D8"></div>
      <sc-for list="{{qr}}" as="q" hint-placeholder-count="200"><div style="position: absolute; left: {{q.l}}px; top: {{q.t}}px; width: 5px; height: 5px; background: #2B2724"></div></sc-for>
      <sc-for list="{{corners}}" as="c" hint-placeholder-count="8"><div style="position: absolute; left: {{c.l}}px; top: {{c.t}}px; width: {{c.w}}px; height: {{c.h}}px; border-radius: 2px; background: #C6F24E"></div></sc-for>
      <span style="position: absolute; left: 10px; bottom: 10px; padding: 5px 9px; border-radius: 9px; background: #14121A; font-size: 11px; font-weight: 600">scan FMutate’s or Humdinger’s code</span>
    </div>
    <div style="display: flex; gap: 8px">
      <label for="mp-code" style="position: absolute; left: -9999px">Pairing code</label>
      <input id="mp-code" type="text" placeholder="or type the code" autocomplete="off" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border-radius: 12px; border: none; background: #1C1925; color: #F3EFF8; padding: 0 14px; font: 700 16px 'JetBrains Mono', monospace; letter-spacing: 0.04em; outline: none">
      <button type="button" style="height: 48px; padding: 0 12px; border-radius: 12px; border: none; background: #2A2636; color: #F3EFF8; font: 600 13px Inter, sans-serif">Paste</button>
    </div>
  </div>

  <div style="position: absolute; left: 348px; top: 8px; width: 468px; height: 374px; display: flex; flex-direction: column; gap: 8px">
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between">
      <span style="font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: #A9A3B8">CONNECTED</span>
      <dc-import mood="proud" size="0.7" hint-size="45px,39px" name="Bird"></dc-import>
    </div>
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="2">
      <div style="border-radius: 16px; background: #1C1925; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 10px; height: 10px; border-radius: 5px; background: {{a.dot}}"></span>
          <div style="flex: 1; line-height: 1.3"><div style="font-size: 15px; font-weight: 700">{{a.name}}</div><div style="font: 500 11px 'JetBrains Mono', monospace; color: #A9A3B8">{{a.sub}}</div></div>
          <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: transparent; box-shadow: inset 0 0 0 1px #4A4560; color: #E4DFEE; font: 600 12px Inter, sans-serif">Disconnect</button>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{a.can}}" as="c" hint-placeholder-count="3"><span style="padding: 4px 8px; border-radius: 8px; background: #2A2636; font: 600 11px/1.2 'JetBrains Mono', monospace; color: #E4DFEE">{{c}}</span></sc-for>
        </div>
      </div>
    </sc-for>
    <div style="border-radius: 16px; background: #1C1925; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="flex: 1"><div style="font-size: 14px; font-weight: 600">Share the stash</div><div style="font-size: 12px; color: #A9A3B8">Paired FMutate sampler firmwares can load your samples.</div></div>
        <span role="switch" aria-checked="true" aria-label="Share the stash" style="width: 48px; height: 28px; border-radius: 14px; background: #C6F24E; position: relative; flex: none"><span style="position: absolute; left: 23px; top: 3px; width: 22px; height: 22px; border-radius: 11px; background: #14121A"></span></span>
      </div>
      <div style="display: flex; gap: 8px; font-size: 12px">
        <span style="flex: 1; height: 36px; border-radius: 10px; background: #14121A; display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span style="color: #A9A3B8">MIDI in</span><span style="font-family: 'JetBrains Mono', monospace">Magpie port · all ch</span></span>
        <span style="flex: 1; height: 36px; border-radius: 10px; background: #14121A; display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span style="color: #A9A3B8">Clock</span><span style="font-family: 'JetBrains Mono', monospace">follow FMutate</span></span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var N = 25, M = 5, ox = 88, oy = 58, seed = 7, qr = [];
    var rnd = function () { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    var finder = function (r, c) {
      var spots = [[0, 0], [0, N - 7], [N - 7, 0]];
      for (var i = 0; i < 3; i++) {
        var fr = r - spots[i][0], fc = c - spots[i][1];
        if (fr >= -1 && fr <= 7 && fc >= -1 && fc <= 7) {
          if (fr < 0 || fc < 0 || fr > 6 || fc > 6) return 0;
          if (fr === 0 || fr === 6 || fc === 0 || fc === 6) return 1;
          if (fr >= 2 && fr <= 4 && fc >= 2 && fc <= 4) return 1;
          return 0;
        }
      }
      return -1;
    };
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var f = finder(r, c), dark;
      if (f >= 0) dark = f === 1; else if (r === 6 || c === 6) dark = (r + c) % 2 === 0; else if (r >= 10 && r <= 14 && c >= 10 && c <= 14) dark = false; else dark = rnd() < 0.48;
      if (dark) qr.push({ l: ox + c * M, t: oy + r * M });
    }
    var L = 62, T = 32, S = 176, k = 26, w = 5;
    var corners = [
      { l: L, t: T, w: k, h: w }, { l: L, t: T, w: w, h: k }, { l: L + S - k, t: T, w: k, h: w }, { l: L + S - w, t: T, w: w, h: k },
      { l: L, t: T + S - w, w: k, h: w }, { l: L, t: T + S - k, w: w, h: k }, { l: L + S - k, t: T + S - w, w: k, h: w }, { l: L + S - w, t: T + S - k, w: w, h: k }
    ];
    var apps = [
      { dot: '#C6F24E', name: 'FMutate A · X0X', sub: 'this phone · paired today', can: ['resample its output', 'load from the stash', 'tempo'] },
      { dot: '#C6F24E', name: 'Humdinger', sub: 'Pixel 7 · Wi-Fi', can: ['plays pads by voice', 'keys mode follows your note'] }
    ];
    return { qr: qr, corners: corners, apps: apps };
  }
}
</script>
</body>
</html>
