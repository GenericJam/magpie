<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magpie library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Pads.dc.html" aria-label="Back to pads" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3EFF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">The stash</h1>
    <dc-import mood="proud" size="0.75" hint-size="48px,42px" name="Bird"></dc-import>
  </div>

  <div role="tablist" aria-label="Library" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925">
    <span role="tab" aria-selected="true" style="height: 38px; border-radius: 9px; background: #34304A; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">Samples · 214</span>
    <span role="tab" aria-selected="false" style="height: 38px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #A9A3B8">Kits · 6</span>
  </div>

  <label for="lib-search" style="position: absolute; left: -9999px">Search samples</label>
  <div style="height: 46px; border-radius: 14px; background: #1C1925; display: flex; align-items: center; gap: 10px; padding: 0 14px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9A3B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input id="lib-search" type="text" placeholder="Search names and tags" style="flex: 1; min-width: 0; border: none; background: transparent; color: #F3EFF8; font: 400 15px Inter, sans-serif; outline: none">
  </div>

  <div style="display: flex; gap: 6px; overflow: hidden; white-space: nowrap">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><span style="flex: none; height: 34px; padding: 0 12px; border-radius: 17px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; font-size: 12px; font-weight: 600">{{c.t}}</span></sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
      <div style="min-height: 56px; border-radius: 14px; background: {{it.bg}}; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; box-shadow: inset 0 0 0 {{it.ringW}}px #C6F24E">
        <button type="button" aria-label="Preview {{it.name}}" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #2A2636; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="{{it.playC}}" aria-hidden="true"><path d="M7 4l12 8-12 8z"></path></svg></button>
        <div style="flex: 1; min-width: 0; line-height: 1.3"><div style="font-size: 14px; font-weight: 600">{{it.name}}</div><div style="font: 500 10px 'JetBrains Mono', monospace; color: #A9A3B8">{{it.meta}}</div></div>
        <div style="width: 64px; height: 22px; display: flex; align-items: center; gap: 1px; flex: none"><sc-for list="{{it.wave}}" as="w" hint-placeholder-count="16"><span style="flex: 1; height: {{w}}px; border-radius: 1px; background: {{it.c}}"></span></sc-for></div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; gap: 8px; align-items: center">
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 14px; border: none; background: #2A2636; color: #F3EFF8; font: 600 14px Inter, sans-serif">+ Import</button>
    <span style="flex: 1; font-size: 12px; line-height: 1.4; color: #A9A3B8">Paired FMutate sampler firmwares can load from here too.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var chips = ['All', 'Recorded', 'From FMutate', 'Firmware packs', 'Imported'].map(function (t, i) { return { t: t, bg: i === 0 ? '#F3EFF8' : '#221F2B', fg: i === 0 ? '#14121A' : '#E4DFEE' }; });
    var seed = 9, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    var wave = function (hit) { var a = []; for (var i = 0; i < 16; i++) a.push(Math.max(2, Math.round(22 * (hit ? Math.exp(-i / 4) : 0.3 + 0.6 * rnd())))); return a; };
    var row = function (name, meta, c, hit, sel) { return { name: name, meta: meta, c: c, wave: wave(hit), bg: sel ? '#2A2636' : '#1C1925', ringW: sel ? 1 : 0, playC: sel ? '#C6F24E' : '#F3EFF8' }; };
    var items = [
      row('Break 96', '4.00 s · recorded · today · loop', '#C6F24E', false, true),
      row('FM stab C4', '0.62 s · from FMutate A · X0X', '#8FD8FF', true, false),
      row('Kitchen pot hit', '0.40 s · recorded · yesterday', '#FF9A7A', true, false),
      row('“Hey!”', '0.35 s · recorded · vox', '#5ED6C0', true, false),
      row('Glass Bell pad', '3.10 s · from FMutate A · stock', '#F3EBD6', false, false),
      row('[pack sample]', '[length] · firmware pack · [firmware]', '#FFB547', true, false),
      row('Field rain', '12.0 s · imported · wav', '#B9A2FF', false, false)
    ];
    return { chips: chips, items: items };
  }
}
</script>
</body>
</html>
